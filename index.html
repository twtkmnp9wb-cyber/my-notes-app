<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style-v2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Заметки</title>
</head>
<body>
    <div id="bgLayer" class="bg-glow"></div>

    <div class="app-container">
        <header class="fixed-top-bar">
            <aside class="main-menu">
                <nav class="main-menu-nav">
                    <ul class="menu-list">
                        <li><button class="menu-btn active" data-tab="feed">Media Library</button></li>
                        <li><button class="menu-btn" data-tab="sprint">Sprint</button></li>
                        <li><button class="menu-btn" data-tab="backlog">Backlog</button></li>
                        <li><button class="menu-btn" data-tab="dump">Core Dump</button></li>
                        <li><button class="menu-btn" data-tab="roadmap">Roadmap</button></li>
                        <li><button class="menu-btn" data-tab="settings">⚙️</button></li>
                    </ul>
                </nav>
            </aside>
        </header>

        <div id="searchDropdownBar" class="search-dropdown-bar">
            <input type="text" id="feedSearchInput" class="search-dropdown-input" placeholder="Поиск по хэштегу (#tag)...">
            <span id="searchCounter" class="search-counter">0 из 0</span>
            <button type="button" class="search-nav-btn" id="searchUpBtn">▲</button>
            <button type="button" class="search-nav-btn" id="searchDownBtn">▼</button>
            <button type="button" class="search-close-btn" id="searchCloseBtn">×</button>
        </div>

        <div class="scroll-viewport">
            <div class="content-wrapper">
                <div style="text-align: center; margin-top: 15px; margin-bottom: 15px;">
                    <h2 style="font-family: 'Caveat', cursive; font-size: 2.5rem; color: rgba(255,255,255,0.85); font-weight: 400; font-style: italic; letter-spacing: 1.5px; margin: 0; text-shadow: 0 2px 12px rgba(0,0,0,0.5);">Born to win.</h2>
                </div>

                <main class="notes-area">
                    <div class="main-container">
                        </div>
                </main>
            </div>
        </div>

        <footer class="app-footer">
            <div class="footer-container">
                <button type="button" class="action-btn" id="searchToggleBtn">🔍</button>
                <button type="button" class="action-btn add-btn" id="addNoteBtn">+</button>
            </div>
        </footer>
    </div>

    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать запись</h3>
                <button type="button" class="close-btn" id="closeModalBtn">×</button>
            </div>

            <div class="type-selector" style="display: flex; gap: 8px; margin-bottom: 14px;">
                <button type="button" class="menu-btn active" id="typeFeedBtn" data-type="feed" style="flex:1; background:rgba(255,255,255,0.15);">📝 Media Library</button>
                <button type="button" class="menu-btn" id="typeTaskBtn" data-type="task" style="flex:1;">⚡ Задача</button>
            </div>

            <div class="modal-body">
                <input type="text" id="noteTitleInput" placeholder="Заголовок..." class="modal-input">
                <textarea id="noteTextInput" placeholder="Текст или описание..." class="modal-textarea"></textarea>

                <div id="feedFieldsBlock">
                    <input type="text" id="noteHashtagInput" placeholder="#хештег..." class="modal-input">
                    <div class="quick-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#учеба</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#проект</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#мысли</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#спорт</span>
                    </div>

                    <div class="media-upload-wrapper">
                        <label for="noteMediaInput" class="menu-btn" style="display:inline-block; background:rgba(255,255,255,0.1); text-align:center; cursor:pointer;">📷 Прикрепить фото</label>
                        <input type="file" id="noteMediaInput" accept="image/*" multiple style="display: none;">
                        <div id="mediaPreviewContainer" class="media-preview-container" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
                    </div>
                </div>

                <div id="taskFieldsBlock" style="display: none; margin-top: 10px;">
                    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                        <select id="taskTargetFolder" class="modal-input" style="flex: 1; cursor: pointer;">
                            <option value="sprint">🚀 В Sprint</option>
                            <option value="backlog">📦 В Backlog</option>
                        </select>
                        <input type="date" id="taskDeadlineInput" class="modal-input" style="flex: 1;">
                    </div>
                    <label style="font-size: 0.85rem; color: rgba(255,255,255,0.6); display: block; margin-bottom: 6px;">Чек-лист:</label>
                    <div id="todoItemsContainer"></div>
                    <button type="button" id="addTodoItemBtn" class="menu-btn" style="width: 100%; margin-top: 6px; background:rgba(255,255,255,0.1);">+ Добавить пункт</button>
                </div>
            </div>

            <div class="modal-footer" style="margin-top: 16px;">
                <button type="button" class="menu-btn active" id="saveNoteBtn" style="width: 100%; background: #4caf50; font-weight: bold;">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="dumpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🌙 Core Dump</h3>
                <button type="button" class="close-btn" id="closeDumpBtn">×</button>
            </div>
            <div class="modal-body">
                <textarea id="liveDumpArea" placeholder="Выгрузи из головы всё..." class="modal-textarea" style="height: 180px;"></textarea>
            </div>
        </div>
    </div>

    <div class="modal" id="roadmapModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🗺 Roadmap</h3>
                <button type="button" class="close-btn" id="closeRoadmapBtn">×</button>
            </div>
            <div class="modal-body">
                <p style="color: rgba(255,255,255,0.7); font-size: 14px;">Здесь будет план развития проекта.</p>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Темы и обои</h3>
                <button type="button" class="close-btn" id="closeSettingsBtn">×</button>
            </div>
            <p style="font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:8px;">Выберите обои:</p>
            <div class="bg-gallery" id="bgGallery" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;"></div>
            
            <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-size: 13px; color: rgba(255,255,255,0.6);">Масштаб (зум):</span>
                    <span id="scaleValueText" style="color: #fff; font-size: 12px; font-weight: 600;">100%</span>
                </div>
                <input type="range" id="bgScaleRange" min="100" max="220" value="100" style="width:100%;" />
            </div>
        </div>
    </div>

    <div id="lightboxModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center;">
        <button type="button" id="lightboxCloseBtn" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">&times;</button>
        <img id="lightboxImg" src="" alt="Zoomed" style="max-width:90%; max-height:90%; border-radius:12px; object-fit:contain;" />
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
