<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style-v2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Монитор Души</title>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-32">
    <!-- Слой обоев с поддержкой зума -->
    <div id="bgLayer" class="bg-glow"></div>

    <div class="app-container">
        <!-- ФИКСИРОВАННЫЙ ТОП-БАР (Liquid Glass капсула) -->
        <header class="fixed-top-bar">
            <aside class="main-menu">
                <nav class="main-menu-nav">
                    <ul class="menu-list">
                        <li><button class="menu-btn active" data-tab="feed">Лента</button></li>
                        <li><button class="menu-btn" data-tab="roadmap">Roadmap</button></li>
                        <li><button class="menu-btn" data-tab="sprint">Sprint</button></li>
                        <li><button class="menu-btn" data-tab="backlog">Backlog</button></li>
                        <li><button class="menu-btn" data-tab="dump">Dump</button></li>
                        <li><button class="menu-btn" data-tab="settings">⚙️</button></li>
                    </ul>
                </nav>
            </aside>
        </header>

        <!-- ПРОКРУЧИВАЕМАЯ ОБЛАСТЬ -->
        <div class="scroll-viewport">
            <div class="content-wrapper">
                
                <!-- МАНИФЕСТ СЕЗОНА — СТАВИМ ПОД МЕНЮ (Только для Ленты или общей шапки) -->
                <div id="manifestSection" style="margin-top: 12px; margin-bottom: 8px;">
                    <div style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 12px; backdrop-filter: blur(16px); text-align: center;">
                        <span style="font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); display: block; margin-bottom: 2px;">Манифест сезона</span>
                        <div style="display: flex; justify-content: center; gap: 10px; font-size: 12px; font-weight: 500;">
                            <span style="font-style: italic; color: #34d399;">#осанка</span>
                            <span style="font-style: italic; color: #34d399;">#речь</span>
                            <span style="font-style: italic; color: #34d399;">#турник</span>
                            <span style="font-style: italic; color: #34d399;">#фокус</span>
                        </div>
                    </div>
                </div>

                <!-- ВЫДВИЖНАЯ ПЛАШКА ПОИСКА (Появляется ниже манифеста на Ленте) -->
                <div id="telegramSearchBarContainer"></div>

                <!-- ЗАГОЛОВОК BORN TO WIN — СТАВИМ НИЖЕ ПЛАШЕК (Только на Ленте) -->
                <div id="bornToWinTitle" style="text-align: center; margin: 14px 0 10px 0;">
                    <h2 class="italic font-serif tracking-wide text-neutral-200 drop-shadow-md" style="font-size: 1.4rem; font-style: italic;">Born to win.</h2>
                </div>

                <main class="notes-area">
                    <div class="main-container">
                        <!-- Контент динамически рендерится из UI.js -->
                    </div>
                </main>
            </div>
        </div>

        <!-- Футер с плавающими кнопками управления (Плюс строго идентичен лупе) -->
        <footer class="app-footer">
            <div class="footer-container">
                <button type="button" class="action-btn" id="searchToggleBtn" title="Поиск">🔍</button>
                <button type="button" class="action-btn add-btn" id="addNoteBtn" title="Создать">+</button>
            </div>
        </footer>
    </div>

    <!-- ВСЕ МОДАЛКИ (Без изменений) -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать запись</h3>
                <button type="button" class="close-btn" id="closeModalBtn">×</button>
            </div>
            <div class="type-selector" style="display: flex; gap: 8px; margin-bottom: 14px;">
                <button type="button" class="menu-btn active" id="typeFeedBtn" style="flex:1;">📝 Лента</button>
                <button type="button" class="menu-btn" id="typeTaskBtn" style="flex:1;">⚡ Задача</button>
            </div>
            <div class="modal-body">
                <input type="text" id="noteTitleInput" placeholder="Заголовок..." class="modal-input">
                <textarea id="noteTextInput" placeholder="Текст или описание..." class="modal-textarea"></textarea>
                <div id="feedFieldsBlock">
                    <input type="text" id="noteHashtagInput" placeholder="#хештег..." class="modal-input">
                    <div class="quick-tags" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px;">
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#осанка</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#речь</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#турник</span>
                        <span class="tag-chip" style="background:rgba(255,255,255,0.1); padding: 4px 10px; border-radius: 8px; font-size: 12px; cursor: pointer;">#фокус</span>
                    </div>
                    <div class="media-upload-wrapper">
                        <label for="noteMediaInput" class="menu-btn" style="display:inline-block; background:rgba(255,255,255,0.1); text-align:center; cursor:pointer; width:100%;">📷 Прикрепить медиафайл</label>
                        <input type="file" id="noteMediaInput" accept="image/*" multiple style="display: none;">
                        <div id="mediaPreviewContainer" class="media-preview-container" style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;"></div>
                    </div>
                </div>
                <div id="taskFieldsBlock" style="display: none; margin-top: 10px;">
                    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                        <select id="taskTargetFolder" class="modal-input" style="flex: 1; cursor: pointer;">
                            <option value="sprint">🚀 В Sprint</option>
                            <option value="backlog">📦 В Backlog</option>
                        </select>
                        <input type="date" id="taskDeadlineInput" class="modal-input" style="flex: 1;">
                    </div>
                    <label style="font-size: 0.85rem; color: rgba(255,255,255,0.6); display: block; margin-bottom: 6px;">Чек-лист:</label>
                    <div id="todoItemsContainer"></div>
                    <button type="button" id="addTodoItemBtn" class="menu-btn" style="width: 100%; margin-top: 6px; background:rgba(255,255,255,0.1);">+ Добавить пункт</button>
                </div>
            </div>
            <div class="modal-footer" style="margin-top: 16px;">
                <button type="button" class="menu-btn active" id="saveNoteBtn" style="width: 100%; background: rgba(255,255,255,0.25); font-weight: bold; text-align: center;">Сохранить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="dumpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🌙 Core Dump</h3>
                <button type="button" class="close-btn" id="closeDumpBtn">×</button>
            </div>
            <div class="modal-body">
                <textarea id="liveDumpArea" placeholder="Поток мыслей перед сном..." class="modal-textarea" style="height: 180px;"></textarea>
            </div>
        </div>
    </div>

    <div class="modal" id="roadmapModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🗺 Roadmap</h3>
                <button type="button" class="close-btn" id="closeRoadmapBtn">×</button>
            </div>
            <div class="modal-body">
                <div style="margin-bottom: 12px; font-size: 13px; color: rgba(255,255,255,0.7);">Вектор поведения и фокус внимания на текущий период.</div>
                <div id="roadmapGoalsContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактировать запись</h3>
                <button type="button" class="close-btn" id="editModalCancel">×</button>
            </div>
            <div class="modal-body">
                <input type="text" id="editModalTitle" placeholder="Заголовок..." class="modal-input">
                <textarea id="editModalText" placeholder="Текст..." class="modal-textarea"></textarea>
            </div>
            <div class="modal-footer" style="margin-top: 16px; display:flex; gap:8px;">
                <button type="button" class="menu-btn" id="editModalCancel" style="flex:1;">Отмена</button>
                <button type="button" class="menu-btn active" id="editModalSave" style="flex:1; background:rgba(255,255,255,0.25);">Обновить</button>
            </div>
        </div>
    </div>

    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Темы и обои</h3>
                <button type="button" class="close-btn" id="settingsCloseBtn">×</button>
            </div>
            <p style="font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:8px;">Загрузить свои обои:</p>
            <input type="file" id="bgFileInput" accept="image/*" class="modal-input" style="margin-bottom: 16px; cursor:pointer;">
            <div style="margin-bottom: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <span style="font-size: 13px; color: rgba(255,255,255,0.6);">Масштаб (зум):</span>
                    <span id="scaleValueText" style="color: #fff; font-size: 12px; font-weight: 600;">100%</span>
                </div>
                <input type="range" id="bgScaleRange" min="100" max="220" value="100" style="width:100%; accent-color: #fff;" />
            </div>
        </div>
    </div>

    <div id="lightboxModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center;">
        <button type="button" id="lightboxCloseBtn" style="position:absolute; top:20px; right:20px; background:none; border:none; color:white; font-size:30px; cursor:pointer;">&times;</button>
        <img id="lightboxImg" src="" alt="Zoomed" style="max-width:90%; max-height:90%; border-radius:12px; object-fit:contain;" />
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
