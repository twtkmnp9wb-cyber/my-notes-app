<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style-v2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Монитор Души</title>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-32">
    <!-- Слой обоев -->
    <div id="bgLayer" class="bg-glow"></div>

    <div class="app-container">
        <!-- ФИКСИРОВАННЫЙ ТОП-БАР -->
        <header class="fixed-top-bar">
            <aside class="main-menu">
                <nav class="main-menu-nav">
                    <ul class="menu-list">
                        <li><button class="menu-btn active" data-tab="feed">Лента</button></li>
                        <li><button class="menu-btn" data-tab="roadmap">Roadmap</button></li>
                        <li><button class="menu-btn" data-tab="sprint">Sprint</button></li>
                        <li><button class="menu-btn" data-tab="backlog">Backlog</button></li>
                        <li><button class="menu-btn" data-tab="dump">Dump</button></li>
                        <li><button class="menu-btn" data-tab="settings">⚙️</button></li>
                    </ul>
                </nav>
            </aside>
        </header>

        <!-- ПРОКРУЧИВАЕМАЯ ОБЛАСТЬ -->
        <div class="scroll-viewport">
            <div class="content-wrapper">
                
                <!-- МАНИФЕСТ СЕЗОНА (Только для Ленты) -->
                <div id="manifestSection" style="margin-top: 10px; margin-bottom: 6px;">
                    <div style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 10px; backdrop-filter: blur(16px); text-align: center;">
                        <span style="font-size: 8px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.5); display: block; margin-bottom: 2px;">Манифест сезона</span>
                        <div style="display: flex; justify-content: center; gap: 10px; font-size: 11px; font-weight: 500;">
                            <span style="font-style: italic; color: #34d399;">#осанка</span>
                            <span style="font-style: italic; color: #34d399;">#речь</span>
                            <span style="font-style: italic; color: #34d399;">#турник</span>
                            <span style="font-style: italic; color: #34d399;">#фокус</span>
                        </div>
                    </div>
                </div>

                <!-- ВЫДВИЖНАЯ ПЛАШКА ПОИСКА -->
                <div id="telegramSearchBarContainer"></div>

                <!-- ЗАГОЛОВОК BORN TO WIN -->
                <div id="bornToWinTitle" style="text-align: center; margin: 10px 0 8px 0;">
                    <h2 class="italic font-serif tracking-wide text-neutral-200 drop-shadow-md" style="font-size: 1.3rem; font-style: italic;">Born to win.</h2>
                </div>

                <main class="notes-area">
                    <div class="main-container">
                        <!-- Контент динамически рендерится из UI.js -->
                    </div>
                </main>
            </div>
        </div>

        <!-- Футер с плавающими стильными кнопками -->
        <footer class="app-footer">
            <div class="footer-container" style="display: flex; gap: 10px; justify-content: center; align-items: center;">
                <button type="button" class="action-btn" id="searchToggleBtn" title="Поиск">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </button>
                <button type="button" class="action-btn" id="editToggleBtn" title="Режим редактирования">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                </button>
                <button type="button" class="action-btn add-btn" id="addNoteBtn" title="Создать">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- МОДАЛКА СОЗДАНИЯ ЗАПИСИ -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать запись</h3>
                <button type="button" class="close-btn" id="closeModalBtn">×</button>
            </div>
            <div class="type-selector" style="display: flex; gap: 8px; margin-bottom: 14px;">
                <button type="button" class="menu-btn active" id="typeFeedBtn" style="flex:1;">📝 Лента</button>
                <button type="button" class="menu-btn" id="typeTaskBtn" style="flex:1;">⚡ Задача</button>
            </div>
            <div class="modal-body">
                <input type="text" id="noteTitleInput" placeholder="Заголовок..." class="modal-input">
                <textarea id="noteTextInput" placeholder="Текст или описание..." class="modal-textarea"></textarea>
                <div id="feedFieldsBlock">
                    <input type="text" id="noteHashtagInput" placeholder="#хештег..." class="modal-input">
                </div>
            </div>
            <div class="modal-footer" style="margin-top: 16px;">
                <button type="button" class="menu-btn active" id="saveNoteBtn" style="width: 100%; background: rgba(255,255,255,0.25); font-weight: bold; text-align: center;">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ ЗАПИСИ -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактировать запись</h3>
                <button type="button" class="close-btn" id="editModalCancel">×</button>
            </div>
            <div class="modal-body">
                <input type="text" id="editModalTitle" class="modal-input" placeholder="Заголовок...">
                <textarea id="editModalText" class="modal-textarea" placeholder="Текст или описание..."></textarea>
            </div>
            <div class="modal-footer" style="margin-top: 16px;">
                <button type="button" class="menu-btn active" id="editModalSave" style="width: 100%; background: rgba(255,255,255,0.25); font-weight: bold; text-align: center;">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА НАСТРОЕК -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Настройки</h3>
                <button type="button" class="close-btn" id="settingsCloseBtn">×</button>
            </div>
            <p style="font-size:13px; color:rgba(255,255,255,0.6); margin-bottom:8px;">Загрузить свои обои:</p>
            <input type="file" id="bgFileInput" accept="image/*" class="modal-input" style="margin-bottom: 16px; cursor:pointer;">
        </div>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
