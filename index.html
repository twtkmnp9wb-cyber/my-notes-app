<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заметки и Проект</title>
    <style>
        /* Общие адаптивные стили */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1e1e24;
            color: #f0f0f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            background: #2a2a35;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-top: 20px;
        }
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .nav-tabs button {
            background: #363645;
            border: none;
            color: #ccc;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .nav-tabs button.active, .nav-tabs button:hover {
            background: #5b5fc7;
            color: #fff;
        }

        /* Панель хэштегов (Шпаргалка) */
        .hashtag-container {
            position: relative;
            display: inline-block;
            margin-bottom: 15px;
        }
        #hashtagHintBtn {
            background: #363645;
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        #hashtagDropdown {
            display: none;
            position: absolute;
            top: 110%;
            left: 0;
            background: #252530;
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            padding: 12px;
            border-radius: 12px;
            width: 240px;
            z-index: 1000;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }
        #hashtagList {
            list-style: none;
            padding: 0;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 13px;
        }
        #hashtagList li {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #newHashtagInput {
            width: 100%;
            padding: 6px 10px;
            background: #1a1a22;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        #addHashtagBtn {
            width: 100%;
            margin-top: 6px;
            padding: 6px;
            background: #5b5fc7;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Навигация -->
        <div class="nav-tabs">
            <button class="active">Roadmap</button>
            <button>Backlog</button>
            <button>Sprint</button>
            <button>Settings</button>
        </div>

        <!-- Кнопка-шпаргалка с хэштегами -->
        <div class="hashtag-container">
            <button type="button" id="hashtagHintBtn">Хэштеги 💡</button>
            <div id="hashtagDropdown">
                <ul id="hashtagList">
                    <!-- Сюда динамически подгружаются теги -->
                </ul>
                <input type="text" id="newHashtagInput" placeholder="#тег - Описание">
                <button type="button" id="addHashtagBtn">Добавить тег</button>
            </div>
        </div>

        <!-- Основное содержимое приложения -->
        <div id="contentArea" style="min-height: 250px; display: flex; align-items: center; justify-content: center; color: #888;">
            Тут твои заметки и медиа...
        </div>
    </div>

    <!-- Модальное окно для галереи фото (Лайтбокс) -->
    <div id="lightboxModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 999999; overscroll-behavior: contain; touch-action: none;">
        
        <!-- Кнопка закрытия -->
        <button type="button" id="lightboxCloseBtn" style="position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;">&times;</button>
        
        <!-- Общий контейнер (картинка + стрелки прямо рядом с ней) -->
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
            
            <!-- Кнопка НАЗАД (слева от картинки) -->
            <button type="button" id="lightboxPrevBtn" style="position: absolute; left: -50px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; transition: background 0.2s;">‹</button>
            
            <!-- Обертка картинки -->
            <div id="lightboxContentWrapper" style="display: flex; align-items: center; justify-content: center; max-width: 75vw; max-height: 75vh;">
                <img id="lightboxImg" src="" alt="Zoomed media" style="max-width: 75vw; max-height: 75vh; border-radius: 12px; object-fit: contain; box-shadow: 0 20px 40px rgba(0,0,0,0.7);" />
            </div>

            <!-- Кнопка ВПЕРЕД (справа от картинки) -->
            <button type="button" id="lightboxNextBtn" style="position: absolute; right: -50px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; transition: background 0.2s;">›</button>
            
        </div>
    </div>

    <script>
        // Логика выпадающего меню хэштегов и сохранения в localStorage
        const hintBtn = document.getElementById('hashtagHintBtn');
        const dropdown = document.getElementById('hashtagDropdown');
        const addBtn = document.getElementById('addHashtagBtn');
        const input = document.getElementById('newHashtagInput');
        const list = document.getElementById('hashtagList');

        // Базовые хэштеги по умолчанию
        let hashtags = JSON.parse(localStorage.getItem('my_app_hashtags')) || [
            "#важное — Срочные задачи и дедлайны",
            "#идеи — Мысли по функционалу",
            "#быт — Личные дела и покупки"
        ];

        function renderHashtags() {
            list.innerHTML = '';
            hashtags.forEach(tag => {
                const li = document.createElement('li');
                li.textContent = tag;
                list.appendChild(li);
            });
            localStorage.setItem('my_app_hashtags', JSON.stringify(hashtags));
        }

        renderHashtags();

        // Открытие/закрытие меню по клику
        hintBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        });

        // Закрытие при клике вне меню
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target) && e.target !== hintBtn) {
                dropdown.style.display = 'none';
            }
        });

        // Добавление нового хэштега
        addBtn.addEventListener('click', () => {
            const val = input.value.trim();
            if (val.length > 0) {
                hashtags.push(val);
                renderHashtags();
                input.value = '';
            }
        });
    </script>
</body>
</html>
