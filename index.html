<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Заметки</title>
</head>
<body>
    <!-- Слой обоев -->
    <div id="bgLayer" class="bg-glow"></div>

    <div class="app-container">
        <!-- ЕДИНЫЙ ФИКСИРОВАННЫЙ БЛОК СВЕРХУ (Меню + Поиск) -->
        <header class="fixed-top-bar">
            <aside class="main-menu">
                <nav class="main-menu-nav">
                    <ul class="menu-list">
                        <li><button class="menu-btn active" data-tab="feed">Лента</button></li>
                        <li><button class="menu-btn" data-tab="sprint">Спринт</button></li>
                        <li><button class="menu-btn" data-tab="backlog">Бэклог</button></li>
                        <li><button class="menu-btn" data-tab="dump">Live Dump</button></li>
                        <li><button class="menu-btn" data-tab="settings">⚙️</button></li>
                    </ul>
                </nav>
            </aside>

            <!-- ПЛАШКА ПОИСКА / ТЕГОВ -->
            <div id="telegramSearchBar" class="hashtag-filter-bar" style="display: none;">
                <input type="text" id="tgSearchInput" placeholder="Поиск по хэштегу (#tag)..." autocomplete="off">
                <span id="tgSearchCounter">0 из 0</span>
                <div class="search-nav-btns">
                    <button type="button" id="tgPrevBtn" title="Предыдущая">▲</button>
                    <button type="button" id="tgNextBtn" title="Следующая">▼</button>
                </div>
                <button type="button" id="tgCloseBtn" title="Закрыть поиск">×</button>
            </div>
        </header>

        <!-- РОДИТЕЛЬ-МАСКА + ПРОКРУЧИВАЕМАЯ ОБЛАСТЬ ЛЕНТЫ -->
        <div class="scroll-viewport">
            <div class="scrollable-content">
                <div class="content-wrapper">
                    <div class="header-logo-container">
                        <img src="images/text.png" alt="Born to win">
                    </div>
                    <main class="notes-area">
                        <div class="main-container">
                            <!-- Заметки добавляются сюда -->
                        </div>
                    </main>
                </div>
            </div>
        </div>

        <!-- Футер с кнопками -->
        <footer class="app-footer">
            <div class="footer-container">
                <button type="button" class="action-btn search-btn" id="searchBtn">🔍</button>
                <button type="button" class="action-btn add-btn" id="addNoteBtn">+</button>
            </div>
        </footer>
    </div>

    <!-- МОДАЛКА СОЗДАНИЯ (Заметка / Задача) -->
    <div class="modal" id="noteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Создать запись</h3>
                <button type="button" class="close-btn" id="closeModalBtn">×</button>
            </div>

            <!-- Переключатель типа -->
            <div class="type-selector">
                <button type="button" class="type-btn active" id="typeFeedBtn" data-type="feed">📝 Лента</button>
                <button type="button" class="type-btn" id="typeTaskBtn" data-type="task">⚡ Задача (Спринт / Бэклог)</button>
            </div>

            <div class="modal-body">
                <input type="text" id="noteTitleInput" placeholder="Заголовок..." class="modal-input">
                <textarea id="noteTextInput" placeholder="Текст или описание..." class="modal-textarea"></textarea>

                <!-- Блок только для ЛЕНТЫ -->
                <div id="feedFieldsBlock">
                    <div class="hashtag-field-wrapper">
                        <input type="text" id="noteHashtagInput" placeholder="#хештег..." class="modal-input">
                        <div class="quick-tags">
                            <span class="tag-chip">#учеба</span>
                            <span class="tag-chip">#проект</span>
                            <span class="tag-chip">#мысли</span>
                            <span class="tag-chip">#спорт</span>
                        </div>
                    </div>

                    <div class="media-upload-wrapper" style="margin-top: 15px;">
                        <label for="noteMediaInput" class="upload-btn">📷 Прикрепить фото</label>
                        <input type="file" id="noteMediaInput" accept="image/*" multiple style="display: none;">
                        <div id="mediaPreviewContainer" class="media-preview-container"></div>
                    </div>
                </div>

                <!-- Блок только для ЗАДАЧ -->
                <div id="taskFieldsBlock" style="display: none; margin-top: 15px;">
                    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                        <select id="taskTargetFolder" class="modal-input" style="flex: 1; cursor: pointer;">
                            <option value="sprint">🚀 В Спринт (Сегодня)</option>
                            <option value="backlog">📦 В Бэклог (На потом)</option>
                        </select>
                        <input type="date" id="taskDeadlineInput" class="modal-input" style="flex: 1;">
                    </div>

                    <label style="font-size: 0.85rem; color: rgba(255,255,255,0.6); display: block; margin-bottom: 6px;">Чек-лист (подзадачи):</label>
                    <div id="todoItemsContainer"></div>
                    <button type="button" id="addTodoItemBtn" class="secondary-btn" style="width: 100%; margin-top: 6px;">+ Добавить пункт</button>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="accent-btn" id="saveNoteBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА LIVE DUMP -->
    <div class="modal" id="dumpModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🌙 Сброс тревоги (Live Dump)</h3>
                <button type="button" class="close-btn" id="closeDumpBtn">×</button>
            </div>
            <div class="modal-body">
                <textarea id="liveDumpArea" placeholder="Выгрузи из головы всё перед сном..." class="modal-textarea" style="height: 180px;"></textarea>
            </div>
        </div>
    </div>

    <!-- Окно выбора обоев -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2 class="modal-title">Темы и обои</h2>
            
            <p class="modal-subtitle">Выберите обои:</p>
            <div class="bg-gallery" id="bgGallery"></div>

            <div class="scale-group" style="margin-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <p class="modal-subtitle" style="margin: 0;">Масштаб (зум):</p>
                    <span id="scaleValueText" style="color: #fff; font-size: 12px; font-weight: 600;">100%</span>
                </div>
                <input type="range" id="bgScaleRange" min="100" max="220" value="100" class="modal-range" />
            </div>

            <p class="modal-subtitle" style="margin-top: 16px;">Загрузить файл с ПК:</p>
            <div class="custom-bg-input-group">
                <input type="text" id="customBgTitleInput" class="modal-input" placeholder="Название обоев..." />
                <label class="file-upload-btn">
                    📁 Выбрать файл
                    <input type="file" id="bgFileInput" accept="image/*" hidden />
                </label>
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button type="button" id="closeSettingsBtn" class="modal-btn cancel-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЛАЙТБОКСА -->
    <div id="lightboxModal">
        <button type="button" id="lightboxCloseBtn" class="lightbox-close">&times;</button>
        
        <div style="position: relative; display: flex; align-items: center; justify-content: center; width: 100%; max-width: 500px; height: 70vh; padding: 0 50px; box-sizing: border-box;">
            <button type="button" id="lightboxPrevBtn" style="position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40;">‹</button>
            
            <div style="display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;">
                <img id="lightboxImg" src="" alt="Zoomed media" style="max-width: 100%; max-height: 100%; border-radius: 12px; object-fit: contain;" />
            </div>

            <button type="button" id="lightboxNextBtn" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 40;">›</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
