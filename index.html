<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <title>Заметки</title>
</head>
<body>
    <div class="bg-glow" id="bgLayer"></div>

    <div class="app-container">
        <aside class="main-menu">
            <nav class="main-menu-nav">
                <ul class="menu-list">
                    <li><button class="menu-btn active">Media Library</button></li>
                    <li><button class="menu-btn">Roadmap</button></li>
                    <li><button class="menu-btn">Backlog</button></li>
                    <li><button class="menu-btn">Sprint</button></li>
                    <li><button class="menu-btn">Settings</button></li>
                </ul>
            </nav>
        </aside>
        <div class="content-wrapper">
            <header class="header">
                <div class="container">
                    <img src="images/text.png" alt="Born to win">
                </div>
            </header>
            <main class="notes-area">
                <div class="main-container">
                    <!-- Заметки -->
                </div>
            </main>
            <footer class="app-footer">
                <div class="footer-container">
                    <!-- Добавили id для поиска и плюсика -->
                    <button type="button" class="action-btn search-btn" id="searchBtn">🔍</button>
                    <button type="button" class="action-btn add-btn" id="addNoteBtn">+</button>
                </div>
            </footer>
        </div>
    </div>

    <!-- Всплывающее окно создания заметки -->
    <div class="modal-overlay" id="noteModal">
        <div class="modal-content">
            <h2 class="modal-title">Новая заметка</h2>
            
            <input type="text" id="noteTitleInput" class="modal-input" placeholder="Заголовок..." />
            <textarea id="noteTextInput" class="modal-textarea" placeholder="Текст заметки..."></textarea>
            
            <div class="hashtag-field-wrapper">
                <input type="text" id="noteHashtagInput" class="modal-input" placeholder="#Хэштег" />
            </div>
            <!-- Блок для прикрепления медиа/файлов -->
            <div class="media-upload-section" style="margin-bottom: 15px;">
                <label class="attachment-btn" id="attachFileLabel" style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: #a0a0a0; font-size: 14px;">
                    📎 <span>Прикрепить файлы</span>
                    <input type="file" id="noteMediaInput" accept="image/*" multiple hidden />
                </label>
                <!-- Контейнер для превью нескольких картинок (горизонтальный скролл в стиле ТГ) -->
                <div id="mediaPreviewContainer" style="display: none; margin-top: 10px; gap: 8px; overflow-x: auto; padding-bottom: 4px;"></div>
            </div>



            <div class="modal-actions">
                <!-- Поправили ID на closeModalBtn как у тебя в HTML -->
                <button type="button" id="closeModalBtn" class="modal-btn cancel-btn">Отмена</button>
                <button type="button" id="saveNoteBtn" class="modal-btn save-btn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Окно выбора обоев -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content">
            <h2 class="modal-title">Темы и обои</h2>
            
            <p class="modal-subtitle">Выберите обои:</p>
            <div class="bg-gallery" id="bgGallery"></div>

            <div class="scale-group" style="margin-top: 16px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                    <p class="modal-subtitle" style="margin: 0;">Масштаб (зум):</p>
                    <span id="scaleValueText" style="color: #fff; font-size: 12px; font-weight: 600;">100%</span>
                </div>
                <input type="range" id="bgScaleRange" min="100" max="220" value="100" class="modal-range" />
            </div>

            <p class="modal-subtitle" style="margin-top: 16px;">Загрузить файл с ПК:</p>
            <div class="custom-bg-input-group">
                <input type="text" id="customBgTitleInput" class="modal-input" placeholder="Название обоев..." />
                <label class="file-upload-btn">
                    📁 Выбрать файл
                    <input type="file" id="bgFileInput" accept="image/*" hidden />
                </label>
            </div>

            <div class="modal-actions" style="margin-top: 20px;">
                <button type="button" id="closeSettingsBtn" class="modal-btn cancel-btn">Закрыть</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ПОИСКА ПО ХЭШТЕГАМ -->
    <div class="modal-overlay" id="searchModal">
        <div class="modal-content">
            <div class="modal-title">Поиск по хэштегам</div>
            <input type="text" class="modal-input" id="hashtagSearchInput" placeholder="Введите хэштег (например: #design)...">
            <div class="modal-actions">
                <button class="modal-btn cancel-btn" id="closeSearchBtn">Закрыть</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
<!-- Модальное окно для галереи фото -->
<div id="lightboxModal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 999999; overscroll-behavior: contain; touch-action: none;">
    
    <!-- Кнопка закрытия -->
    <button type="button" id="lightboxCloseBtn" style="position: absolute; top: 20px; right: 20px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;">&times;</button>
    
    <!-- Общий контейнер (картинка + стрелки прямо рядом с ней) -->
    <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        
        <!-- Кнопка НАЗАД (слева от картинки) -->
        <button type="button" id="lightboxPrevBtn" style="position: absolute; left: -60px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; transition: background 0.2s;">‹</button>
        
        <!-- Обертка картинки -->
        <div id="lightboxContentWrapper" style="display: flex; align-items: center; justify-content: center; max-width: 75vw; max-height: 75vh;">
            <img id="lightboxImg" src="" alt="Zoomed media" style="max-width: 75vw; max-height: 75vh; border-radius: 12px; object-fit: contain; box-shadow: 0 20px 40px rgba(0,0,0,0.7);" />
        </div>

        <!-- Кнопка ВПЕРЕД (справа от картинки) -->
        <button type="button" id="lightboxNextBtn" style="position: absolute; right: -60px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid rgba(255, 255, 255, 0.3); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 20; transition: background 0.2s;">›</button>
        
    </div>
</div>





</body>
</html>
