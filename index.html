<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-title" content="Монитор">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Монитор Души</title>
</head>
<body>
    <!-- Слой обоев -->
    <div id="bgLayer"></div>

    <div class="app-container">
        <!-- Верхнее меню (Liquid Glass капсула) + плашка архива -->
        <header class="fixed-top-bar">
            <nav class="menu-list">
                <button class="menu-btn active" data-act="tab" data-tab="feed">Library</button>
                <button class="menu-btn" data-act="tab" data-tab="roadmap">Roadmap</button>
                <button class="menu-btn" data-act="tab" data-tab="sprint">Sprint</button>
                <button class="menu-btn" data-act="tab" data-tab="backlog">Backlog</button>
                <button class="menu-btn" data-act="tab" data-tab="dump">Dump</button>
                <button class="menu-btn" data-act="settings" title="Настройки">⚙️</button>
            </nav>
            <div class="archive-banner" id="archiveBanner" hidden></div>
        </header>

        <!-- Подшапка ленты: манифест + поиск + «Born to win». Заполняется из ui.js -->
        <div class="page-sticky-header hidden" id="feedStickyHeader">
            <div class="page-sticky-header-inner"></div>
        </div>

        <!-- Подшапка Backlog: чипсы категорий -->
        <div class="page-sticky-header hidden" id="backlogStickyHeader">
            <div class="page-sticky-header-inner" id="backlogChipsSlot"></div>
        </div>

        <div class="scroll-viewport" id="scrollViewport">
            <main class="content-wrapper main-container"></main>
        </div>

        <footer class="app-footer">
            <div class="footer-container">
                <button type="button" class="action-btn" id="searchToggleBtn" data-act="search-toggle" title="Поиск">🔍</button>
                <button type="button" class="action-btn add-btn" id="addNoteBtn" data-act="add" title="Добавить">+</button>
            </div>
        </footer>
    </div>

    <!-- Универсальная модалка форм (пост, цель, задача, карточка...) -->
    <div class="modal" id="formModal"><div class="modal-content"></div></div>

    <!-- Полноэкранный просмотр фото и видео -->
    <div class="viewer" id="mediaViewer" hidden></div>

    <!-- Настройки -->
    <div class="modal" id="settingsModal"><div class="modal-content"></div></div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
